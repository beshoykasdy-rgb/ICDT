<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقارير الإحصائية - مديرية الصحة والسكان بسوهاج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>
<body>

<div class="topbar">
  <div class="live"><span class="dot"></span><span>منظومة التقارير الإحصائية</span></div>
  <div id="clock"></div>
</div>

<header>
  <div class="logo-wrap">
    <img class="logo" src="logo.png" alt="مديرية الصحة والسكان بسوهاج" onerror="this.parentNode.style.display='none'">
  </div>
  <div class="org">مديرية الصحة والسكان بسوهاج</div>
  <h1>إعداد وتصميم<br>مركز المعلومات والتحول الرقمي</h1>
  <div class="rule"><i></i></div>
  <div class="sup">تحت إشراف <b>د/ بيشوي قصدي بشارة</b></div>
</header>

<main>
  <section class="section">
    <div class="section-head">
      <div class="sico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M12 8v4M10 10h4"/></svg>
      </div>
      <h2>المستشفيات</h2>
      <div class="line"></div>
    </div>
    <div class="grid" id="hospitals"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="sico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5H5v5M12 11.5h7v5"/></svg>
      </div>
      <h2>الإدارات الصحية</h2>
      <div class="line"></div>
    </div>
    <div class="grid" id="departments"></div>
  </section>
</main>

<footer>إعداد وتصميم <b>مركز المعلومات والتحول الرقمي</b> — مديرية الصحة والسكان بسوهاج</footer>

<script src="script.js"></script>

</html>
